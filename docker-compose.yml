version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: portfolio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/portfolio_db?schema=public"
      JWT_SECRET: "prod-jwt-secret-portfolio"
      REFRESH_TOKEN_SECRET: "prod-refresh-secret-portfolio"
      CORS_ORIGIN: "http://localhost:3000"
    depends_on:
      - postgres

volumes:
  postgres_data:
